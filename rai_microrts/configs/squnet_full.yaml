# Full-featured Squnet selfplay config with all improvements enabled
# Inherits from Microrts-squnet-map16-selfplay then overrides
#
# Usage:
#   python train.py --algo ppo --env Microrts-squnet-map16-selfplay

algo: ppo
env: Microrts-squnet-map16-selfplay
seed: 1

device_hyperparams:
  set_float32_matmul_precision: high
  torch_compile: true
  compile_mode: "reduce-overhead"

algo_hyperparams:
  autocast_loss: true
  autocast_amp_dtype: "bfloat16"
  normalize_value_targets: true
  adaptive_entropy: true
  target_entropy: 1.5
  clip_range_schedule: "cosine"
  clip_range_schedule_min: 0.1
  gradient_checkpointing: false   # enable for 24+GB GPU mem saving
